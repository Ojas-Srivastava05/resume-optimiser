name: Hiring Contacts Discover

on:
  schedule:
    # Mon/Wed/Fri/Sat 6:30 AM IST = 1:00 AM UTC — grow HQ pool between outreach days
    - cron: "0 1 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Companies to probe this run"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: hiring-contacts-discover
  cancel-in-progress: false

defaults:
  run:
    working-directory: hiring-contacts

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hiring-contacts/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install git
        run: sudo apt-get update -qq && sudo apt-get install -y -qq git

      - name: Ensure base contact DB
        run: |
          if [ ! -f data/merged/master_contacts.csv ]; then
            python3 scripts/refresh_all.py
          fi

      - name: Incremental HQ discovery
        run: |
          BATCH="${{ github.event.inputs.batch_size }}"
          if [ -z "$BATCH" ]; then BATCH=50; fi
          echo "Trigger: ${{ github.event_name }} batch_size=${BATCH}"
          python3 scripts/discover_contacts.py --batch-size "$BATCH"

      - name: Commit discovery + contact growth
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            hiring-contacts/data/discovery_state.json \
            hiring-contacts/data/raw/incremental_hq_contacts.csv \
            hiring-contacts/data/merged/master_contacts.csv \
            hiring-contacts/data/merged/tier_*.csv \
            hiring-contacts/data/merged/hq_stats.json \
            || true
          if git diff --staged --quiet; then
            echo "No new contacts discovered"
          else
            git commit -m "chore(hiring-contacts): incremental HQ discovery"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
