name: Internship Scout Daily

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC (primary)
    - cron: "30 2 * * *"
    # 12:30 PM IST = 7:00 AM UTC (backup if morning run times out)
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch + preview, no SMTP)"
        required: false
        default: false
        type: boolean
      full_scan:
        description: "Full scan (ignore send-count limit)"
        required: false
        default: "false"
        type: boolean
      no_hackathons:
        description: "Skip hackathon scouting"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: internship-scout-daily
  cancel-in-progress: false

jobs:
  scout:
    defaults:
      run:
        working-directory: internship-scout
    runs-on: ubuntu-latest
    # Careers fills until CAREERS_TIME_BUDGET_SEC; leave headroom for other sources + email
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore seen-jobs cache
        uses: actions/cache@v4
        with:
          path: internship-scout/seen_jobs.json
          key: internship-scout-seen-jobs-v1
          restore-keys: |
            internship-scout-seen-jobs-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: internship-scout/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Gmail SMTP credentials
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_VERIFY_LABEL: internship-scout
        run: python3 ../.github/scripts/verify-smtp.py

      - name: Run internship scout (fast)
        env:
          FAST_MODE: "1"
          COMPANY_BATCH_SIZE: "120"
          # 0 = queue every company; scrape until time budget (as many as fit)
          CAREERS_MAX_SCRAPES: "0"
          CAREERS_TIME_BUDGET_SEC: "1200"
          CAREERS_MAX_URLS_PER_COMPANY: "2"
          CAREERS_HTTP_TIMEOUT: "12"
          ORACLE_PROBE_PER_RUN: "20"
          MAX_EMAIL_SENDS: "2"
          FETCH_WORKERS: "24"
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          echo "Trigger: ${{ github.event_name }} at $(date -u)"
          FLAGS="--fast --no-sync"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.full_scan }}" = "true" ]; then
            FLAGS="$FLAGS --full"
          fi
          if [ "${{ github.event.inputs.no_hackathons }}" = "true" ]; then
            FLAGS="$FLAGS --no-hackathons"
          fi
          echo "Flags: $FLAGS"
          python scout.py $FLAGS

      - name: Upload seen jobs cache
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: seen-jobs
          path: internship-scout/seen_jobs.json
          if-no-files-found: ignore
