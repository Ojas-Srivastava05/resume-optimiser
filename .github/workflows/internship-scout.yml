name: Internship Scout Daily

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC (primary)
    - cron: "30 2 * * *"
    # Backup slot 8:30 AM IST — GitHub cron can be delayed/skipped on private repos
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internship-scout-daily
  cancel-in-progress: false

defaults:
  run:
    working-directory: internship-scout

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Restore seen-jobs cache
        uses: actions/cache@v4
        with:
          path: internship-scout/seen_jobs.json
          key: internship-scout-seen-jobs-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: internship-scout/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Quick source health check
        run: python test_sources.py

      - name: Run internship scout (fast)
        env:
          FAST_MODE: "1"
          COMPANY_BATCH_SIZE: "120"
          MAX_EMAIL_SENDS: "2"
          FETCH_WORKERS: "16"
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          echo "Trigger: ${{ github.event_name }} at $(date -u)"
          python scout.py --fast --no-sync

      - name: Upload seen jobs cache
        uses: actions/upload-artifact@v4
        with:
          name: seen-jobs
          path: internship-scout/seen_jobs.json
          if-no-files-found: ignore

  # Belt-and-suspenders: GitHub cron often skips new/infrequent workflows on private repos.
  # After the morning scout succeeds, trigger cold outreach on weekday mornings (IST).
  trigger-cold-outreach:
    needs: scout
    if: needs.scout.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Weekday morning gate (IST)
        id: gate
        run: |
          DOW=$(TZ=Asia/Kolkata date +%u)
          HOUR=$(TZ=Asia/Kolkata date +%H)
          if [ "$DOW" -le 5 ] && [ "$HOUR" -ge 8 ] && [ "$HOUR" -lt 12 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Weekday morning IST — will trigger cold outreach"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside weekday 8–12 AM IST window — skipping cold outreach"
          fi

      - name: Trigger cold outreach workflow
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Cold Outreach (Summer 2027)" --ref main \
            -f dry_run=false \
            -f limit=10 \
            -f followups_only=false
          echo "Cold outreach workflow dispatched"
