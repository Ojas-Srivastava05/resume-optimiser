name: Cold Outreach (Summer 2027)

on:
  schedule:
    # Mon–Fri: 1 email per hour at 13:00 / 14:00 / 15:00 IST (max 3/day)
    - cron: "30 7 * * 1-5"   # 13:00 IST
    - cron: "30 8 * * 1-5"   # 14:00 IST
    - cron: "30 9 * * 1-5"   # 15:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose only, no SMTP) — keep true unless you intend to send"
        required: false
        default: "true"
        type: boolean
      limit:
        description: "Max emails this run (hard cap 1 per run, 3/day)"
        required: false
        default: "1"
      followups_only:
        description: "Send follow-ups only"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: cold-outreach
  cancel-in-progress: false

defaults:
  run:
    working-directory: hiring-contacts

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hiring-contacts/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure contact DB exists
        run: |
          if [ ! -f data/merged/master_contacts.csv ]; then
            python3 scripts/refresh_all.py --skip-clone
          fi

      - name: Discover fresh HQ contacts
        run: python3 scripts/discover_contacts.py --batch-size 15

      - name: Run cold outreach (max 1 email this run)
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          COLD_EMAIL_DAILY_CAP: "3"
          COLD_EMAIL_MAX_PER_RUN: "1"
          COLD_EMAIL_MIN_INTERVAL_SEC: "3600"
          COLD_EMAIL_MAX_PER_COMPANY_PER_DAY: "1"
        run: |
          RUN_LIMIT="${{ github.event.inputs.limit || '1' }}"
          FLAGS="--save-drafts --limit $RUN_LIMIT"
          # Scheduled runs always live (1/hour). Manual dispatch defaults to dry-run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.followups_only }}" = "true" ]; then
            FLAGS="$FLAGS --followups"
          fi
          python3 cold_outreach.py $FLAGS

      - name: Commit outreach state
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hiring-contacts/data/outreach_state.json \
                  hiring-contacts/data/blocklist.json \
                  hiring-contacts/data/discovery_state.json \
                  hiring-contacts/data/merged/master_contacts.csv \
                  hiring-contacts/data/raw/incremental_hq_contacts.csv || true
          git diff --staged --quiet || git commit -m "chore(cold-outreach): update send state"
          git push || true

      - name: Upload drafts artifact
        uses: actions/upload-artifact@v4
        with:
          name: cold-email-drafts
          path: hiring-contacts/data/drafts/
          if-no-files-found: ignore
