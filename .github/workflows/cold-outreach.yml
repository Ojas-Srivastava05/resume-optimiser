name: Cold Outreach (Summer 2027)

on:
  schedule:
    # Mon–Fri hourly 13:00–17:00 IST (07:30–11:30 UTC). Script enforces 3/day + 1h gap.
    - cron: "30 7-11 * * 1-5"
    # Late catch-up if GitHub skips earlier slots (18:00 / 18:30 IST)
    - cron: "30 12 * * 1-5"
    - cron: "0 13 * * 1-5"
  # Backup when morning Internship Scout finishes (weekdays only; gated in job)
  workflow_run:
    workflows: ["Internship Scout Daily"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose only, no SMTP) — keep true unless you intend to send"
        required: false
        default: true
        type: boolean
      limit:
        description: "Max emails this run (hard cap 1 per run, 3/day)"
        required: false
        default: "1"
      followups_only:
        description: "Send follow-ups only"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: hiring-contacts-git-state
  cancel-in-progress: false

defaults:
  run:
    working-directory: hiring-contacts

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        run: |
          SHOULD=true
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Skip: Internship Scout did not succeed."
              SHOULD=false
            fi
            DOW=$(TZ=Asia/Kolkata date +%u)
            if [ "$DOW" -ge 6 ]; then
              echo "Skip: weekend workflow_run backup."
              SHOULD=false
            fi
          fi
          echo "should_run=$SHOULD" >> "$GITHUB_OUTPUT"

  outreach:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hiring-contacts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ensure contact DB exists
        run: |
          if [ ! -f data/merged/master_contacts.csv ]; then
            python3 scripts/refresh_all.py --skip-clone
          fi

      - name: Discover fresh HQ contacts
        continue-on-error: true
        run: python3 scripts/discover_contacts.py --batch-size 15

      - name: Run cold outreach (max 1 email this run)
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          COLD_EMAIL_DAILY_CAP: "3"
          COLD_EMAIL_MAX_PER_RUN: "1"
          COLD_EMAIL_MIN_INTERVAL_SEC: "3600"
          COLD_EMAIL_MAX_PER_COMPANY_PER_DAY: "1"
          # Scheduled + workflow_run runs are live. Manual dispatch uses dry_run input.
          OUTREACH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run }}
          OUTREACH_FOLLOWUPS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.followups_only }}
        run: |
          RUN_LIMIT="${{ github.event.inputs.limit || '1' }}"
          FLAGS="--save-drafts --limit $RUN_LIMIT"
          if [ "$OUTREACH_DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$OUTREACH_FOLLOWUPS" = "true" ]; then
            FLAGS="$FLAGS --followups"
          fi
          echo "Trigger: ${{ github.event_name }} at $(TZ=Asia/Kolkata date '+%F %H:%M %Z')"
          python3 cold_outreach.py $FLAGS

      - name: Commit outreach state
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != true
        working-directory: .
        run: |
          bash .github/scripts/git-push-state.sh "chore(cold-outreach): update send state" \
            hiring-contacts/data/outreach_state.json \
            hiring-contacts/data/blocklist.json

      - name: Upload drafts artifact
        uses: actions/upload-artifact@v4
        with:
          name: cold-email-drafts
          path: hiring-contacts/data/drafts/
          if-no-files-found: ignore
