name: OA Daily Drill

on:
  schedule:
    # 7:30 AM IST = 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email, no state update)"
        required: false
        default: "false"
        type: boolean
      company:
        description: "Optional company slug (e.g. microsoft)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: oa-daily-drill
  cancel-in-progress: false

defaults:
  run:
    working-directory: internship-scout

jobs:
  oa-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: internship-scout/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OA drill
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Trigger: ${{ github.event_name }} at $(date -u)"
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.company }}" ]; then
            FLAGS="$FLAGS --company ${{ github.event.inputs.company }}"
          fi
          python oa_scout.py $FLAGS

      - name: Commit rotation state
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        working-directory: .
        run: |
          bash .github/scripts/git-push-state.sh "chore(oa-daily): update rotation state" \
            internship-scout/data/oa_daily_state.json \
            internship-scout/data/oa_companies_cache.json
