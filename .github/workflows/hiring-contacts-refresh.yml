name: Hiring Contacts Refresh

on:
  schedule:
    # Sunday 8:00 AM IST = 2:30 AM UTC
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hiring-contacts-refresh
  cancel-in-progress: false

defaults:
  run:
    working-directory: hiring-contacts

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hiring-contacts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh contact database
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_all.py

      - name: Commit merged contact data
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hiring-contacts/data/merged/ \
                  hiring-contacts/data/raw/scout_companies_snapshot.csv \
                  hiring-contacts/data/sources.json || true
          if git diff --staged --quiet; then
            echo "No contact data changes to commit"
          else
            git commit -m "chore(hiring-contacts): refresh contact database"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload ingest report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: hiring-contacts-ingest-report
          path: hiring-contacts/data/merged/ingest_report.json
          if-no-files-found: warn
