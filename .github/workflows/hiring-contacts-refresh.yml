name: Hiring Contacts Refresh

on:
  schedule:
    # Sunday 8:00 AM IST — purge any junk that slipped in; never rebuild from legacy scrapes
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hiring-contacts-git-state
  cancel-in-progress: false

defaults:
  run:
    working-directory: hiring-contacts

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hiring-contacts/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Purge inauthentic contacts
        run: python3 scripts/purge_inauthentic_contacts.py

      - name: Commit authentic-only database
        working-directory: .
        run: |
          bash .github/scripts/git-push-state.sh "chore(hiring-contacts): purge inauthentic contacts" \
            hiring-contacts/data/merged/ \
            hiring-contacts/data/raw/incremental_hq_contacts.csv \
            hiring-contacts/data/archive/purged_contacts.csv
