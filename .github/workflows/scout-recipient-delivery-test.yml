name: Scout Recipient Delivery Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: internship-scout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: internship-scout/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify SMTP
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_VERIFY_LABEL: recipient-delivery-test
        run: python3 ../.github/scripts/verify-smtp.py
      - name: Send test + check Sent
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          EXTRA_RECIPIENTS: ${{ secrets.EXTRA_RECIPIENTS }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python test_recipient_delivery.py
