name: Resend Today Digest (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internship-scout-resend
  cancel-in-progress: true

jobs:
  resend:
    defaults:
      run:
        working-directory: internship-scout
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: internship-scout/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Gmail SMTP credentials
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_VERIFY_LABEL: internship-scout-resend
        run: python3 ../.github/scripts/verify-smtp.py

      - name: Resend today's digest to all recipients
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          EXTRA_RECIPIENTS: ${{ secrets.EXTRA_RECIPIENTS }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python resend_today_digest.py
