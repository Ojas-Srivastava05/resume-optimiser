name: Daily Internship + Hackathon Scout

on:
  schedule:
    # Runs at 8:00 AM IST (2:30 AM UTC) every day
    - cron: "30 2 * * *"
    # Runs at 8:00 PM IST (2:30 PM UTC) every day — evening catch-up
    - cron: "30 14 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      full_scan:
        description: "Full scan (ignore send-count limit)"
        required: false
        default: "false"
        type: boolean
      no_hackathons:
        description: "Skip hackathon scouting"
        required: false
        default: "false"
        type: boolean

env:
  FAST_MODE: "1"
  COMPANY_BATCH_SIZE: "120"
  FETCH_WORKERS: "16"
  MAX_EMAIL_SENDS: "2"

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internship + hackathon scout
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          FLAGS="--fast"
          if [ "${{ github.event.inputs.full_scan }}" = "true" ]; then
            FLAGS="$FLAGS --full"
          fi
          if [ "${{ github.event.inputs.no_hackathons }}" = "true" ]; then
            FLAGS="$FLAGS --no-hackathons"
          fi
          python scout.py $FLAGS
