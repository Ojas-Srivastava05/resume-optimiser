name: Daily OA Drill

on:
  schedule:
    # 7:30 AM IST (2:00 AM UTC) — before internship scout
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email, no state update)"
        required: false
        default: "false"
        type: boolean
      company:
        description: "Optional company slug override (e.g. microsoft)"
        required: false
        default: ""

jobs:
  oa-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: internship-scout/requirements.txt

      - name: Install dependencies
        working-directory: internship-scout
        run: pip install -r requirements.txt

      - name: Run OA drill
        working-directory: internship-scout
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.company }}" ]; then
            FLAGS="$FLAGS --company ${{ github.event.inputs.company }}"
          fi
          python oa_scout.py $FLAGS

      - name: Commit rotation state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internship-scout/data/oa_daily_state.json internship-scout/data/oa_companies_cache.json || true
          git diff --staged --quiet || git commit -m "chore(oa-daily): update rotation state"
          git push || true
